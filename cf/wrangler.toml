name = "brenvel-solar-bot"
main = "worker.js"
account_id = "69fdcc4ab632f1237581e3afb943d184"
compatibility_date = "2025-01-01"
workers_dev = true

# Subscribers (Worker-managed). MUST stay above [vars] — in TOML a bare key
# after a [table] header would bind to that table.
kv_namespaces = [
  { binding = "SOLAR_STATE", id = "555e58b147e34526823da3d881fb5e01" }
]

[vars]
# Encrypted live status file, published to the bot-state branch by GitHub Actions.
DATA_URL = "https://raw.githubusercontent.com/tantisch/brenvel-solar-dashboard/bot-state/status.enc"
# Always-allowed chat ids (owner), comma-separated — works even if KV is empty.
OWNER_CHATS = "1081188172"

# Secrets (set with `wrangler secret put`, never committed):
#   BOT_TOKEN, BOT_PASSWORD, WEBHOOK_SECRET, DATA_KEY
