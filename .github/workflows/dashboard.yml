name: Build & publish solar dashboard

# GitHub throttles frequent `schedule` crons heavily (it often fires only every
# ~2h). So instead of relying on the scheduler for cadence, a single run LOOPS
# internally — rebuilding and republishing every ~5 minutes — and deploys by
# pushing the encrypted page to the `gh-pages` branch (served by GitHub Pages).
# The schedule/dispatch just (re)starts the loop if it ever stops. The
# concurrency group guarantees only one loop is ever running.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Loop window in seconds (default ~5h; small values test the hand-over)"
        required: false
        default: "18000"
  repository_dispatch:
    types: [refresh]
  push:
    branches: [main]

permissions:
  contents: write          # push the built site to the gh-pages branch
  actions: write           # the loop re-dispatches itself when its window ends

concurrency:
  group: solar-dashboard
  cancel-in-progress: true # a newer run replaces the looping one (single loop)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 335    # loop exits at ~5h; safely under the 6h hard cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build, encrypt and publish every ~5 minutes
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
          NETECO_USER: ${{ secrets.NETECO_USER }}
          NETECO_PASSWORD: ${{ secrets.NETECO_PASSWORD }}
          SOLARMAN_TOKEN: ${{ secrets.SOLARMAN_TOKEN }}
          STATICRYPT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # Telegram bot (fault alerts + daily/weekly/monthly reports). The bot
          # is simply skipped if these two secrets are not set.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '21' }}
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          LOOP_WINDOW: ${{ inputs.window || '18000' }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git"
          W="${LOOP_WINDOW:-18000}"; case "$W" in ''|*[!0-9]*) W=18000;; esac
          [ "$W" -gt 18000 ] && W=18000   # stay under the 6h job cap
          END=$(( $(date +%s) + W ))      # loop for ~5h, then hand over to a new run
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s); n=$((n+1))
            # Pull the latest main each cycle so tariff edits (config/prices.json)
            # and code changes are picked up within one cycle without a restart.
            git fetch -q origin main 2>/dev/null && git reset --hard -q origin/main 2>/dev/null || echo "main sync skipped"
            echo "::group::cycle $n  $(date -u +%FT%TZ)"
            (
              set -e
              python build_dashboard.py
              rm -rf build site && mkdir -p build
              cp output/dashboard.html build/index.html
              npx -y staticrypt@3 build/index.html --short \
                --salt 9d90a60f8bcf475e741e4bd5b63c41b0 --remember 30 \
                --template-title "Сонячний парк Brenvel" \
                --template-instructions "Введіть пароль команди, щоб переглянути панель сонячних станцій." \
                --template-color-primary "#16a34a" \
                --template-button "Переглянути панель" \
                --template-placeholder "Пароль" \
                --template-remember "Запам'ятати мене" \
                --template-error "Невірний пароль" \
                -d site
              test -f site/index.html
              touch site/.nojekyll
              cd site
              git init -q
              git checkout -q -b gh-pages
              git add -A
              git -c user.email=actions@github.com -c user.name="solar-bot" commit -q -m "update $(date -u +%FT%TZ)"
              git push -q -f "$REPO" gh-pages
            ) && echo "published cycle $n" || echo "cycle $n failed; previous version kept live"

            # --- Telegram bot: fault alerts + day/week/month reports ---------
            # Runs on the fresh output/data.json from build_dashboard.py above.
            # State (station health + last report dates — nothing sensitive)
            # lives on the orphan `bot-state` branch so it survives across runs.
            # Isolated in its own subshell: a Telegram hiccup never breaks deploy.
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
              (
                TMP="${RUNNER_TEMP:-/tmp}"; ST="$TMP/bot_state.json"
                if git fetch -q origin bot-state 2>/dev/null; then
                  git show FETCH_HEAD:bot_state.json > "$ST" 2>/dev/null || echo '{}' > "$ST"
                else
                  echo '{}' > "$ST"
                fi
                python notify.py "$ST" || echo "notify.py errored"
                # Live status for the Cloudflare /status bot: build the snapshot and
                # encrypt it with the dashboard password (the public branch keeps no
                # plaintext fleet data; the Worker decrypts with the same password).
                python notify.py snapshot "$TMP/status.json" \
                  && DATA_PASSWORD="$STATICRYPT_PASSWORD" python cryptoutil.py enc "$TMP/status.json" > "$TMP/status.enc" \
                  || echo "status snapshot/encrypt failed"
                # Full encrypted bundle (tariffs + display names applied) for the
                # live Cloudflare dashboard page; falls back to the raw dataset.
                B=output/bundle.json; [ -s "$B" ] || B=output/data.json
                DATA_PASSWORD="$STATICRYPT_PASSWORD" python cryptoutil.py enc "$B" > "$TMP/data.enc" \
                  || echo "data.enc encrypt failed"
                sd="$TMP/botstate"; rm -rf "$sd"; mkdir -p "$sd"; cp "$ST" "$sd/bot_state.json"
                [ -s "$TMP/status.enc" ] && cp "$TMP/status.enc" "$sd/status.enc"
                [ -s "$TMP/data.enc" ] && cp "$TMP/data.enc" "$sd/data.enc"
                ( cd "$sd" && git init -q && git checkout -q -b bot-state && git add -A \
                  && git -c user.email=actions@github.com -c user.name="solar-bot" \
                       commit -q -m "state $(date -u +%FT%TZ)" \
                  && git push -q -f "$REPO" bot-state ) || echo "bot-state push failed"
              ) || echo "telegram notifier skipped (error)"
            fi
            echo "::endgroup::"
            # Stations report every 5 min (inverter/datalogger native interval),
            # so cycle every ~5 min — as live as the source gets.
            EL=$(( $(date +%s) - START )); S=$(( 300 - EL )); [ "$S" -lt 20 ] && S=20
            echo "next cycle in ${S}s"; sleep "$S"
          done
          # Hand over to a fresh run right away. The cron alone is not enough:
          # GitHub delays/drops it for hours (the page sat stale 09:38→13:20Z on
          # 28.11). workflow_dispatch via GITHUB_TOKEN does start a new run; the
          # concurrency group then retires this one. Cron stays as a fallback.
          echo "loop window elapsed; dispatching the next run"
          # Public repos auto-disable workflows after 60 days without repo
          # activity, and a disabled workflow refuses dispatch. Re-enabling is a
          # no-op when it is already enabled.
          gh workflow enable dashboard.yml -R "$REPO_SLUG" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            gh workflow run dashboard.yml --ref main -R "$REPO_SLUG" && exit 0
            echo "self-dispatch attempt $i failed; retrying"; sleep 30
          done
          echo "self-dispatch failed; the schedule will restart the loop"
